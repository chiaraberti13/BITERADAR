name: 🐞 Bug report
description: Report a defect in the analyzer, the game or the UI.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste a real email with personal data** — reproduce with a synthetic sample.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal synthetic sample if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, app version / commit.
  - type: checkboxes
    id: confirms
    attributes:
      label: Confirmation
      options:
        - label: This report contains no real email, credentials or personal data.
          required: true
